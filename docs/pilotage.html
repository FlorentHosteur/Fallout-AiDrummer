<title>Pilotage AI Drummer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: cockpit — header with live counters, four views (questions first), cards only for what the owner acts on. */
:root {
  --bg: oklch(0.985 0.004 290); --surface: oklch(1 0 0); --surface-2: oklch(0.965 0.008 290);
  --ink: oklch(0.24 0.03 285); --ink-soft: oklch(0.46 0.025 285); --line: oklch(0.9 0.012 290);
  --brand: oklch(0.52 0.2 300); --brand-ink: oklch(0.42 0.19 300); --brand-soft: oklch(0.95 0.035 300); --on-brand: oklch(0.99 0 0);
  --ok: oklch(0.52 0.13 155); --ok-soft: oklch(0.95 0.04 155); --warn: oklch(0.55 0.13 70); --warn-soft: oklch(0.96 0.05 80);
  --risk: oklch(0.55 0.18 25); --risk-soft: oklch(0.96 0.03 25); --info: oklch(0.5 0.12 240); --info-soft: oklch(0.95 0.03 240);
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(0.17 0.02 285); --surface: oklch(0.21 0.022 285); --surface-2: oklch(0.25 0.025 285);
  --ink: oklch(0.94 0.01 290); --ink-soft: oklch(0.74 0.02 290); --line: oklch(0.32 0.025 285);
  --brand: oklch(0.72 0.15 300); --brand-ink: oklch(0.8 0.12 300); --brand-soft: oklch(0.3 0.06 300); --on-brand: oklch(0.16 0.02 285);
  --ok: oklch(0.76 0.13 155); --ok-soft: oklch(0.29 0.05 155); --warn: oklch(0.8 0.12 80); --warn-soft: oklch(0.3 0.05 80);
  --risk: oklch(0.75 0.15 25); --risk-soft: oklch(0.3 0.06 25); --info: oklch(0.76 0.11 240); --info-soft: oklch(0.29 0.05 240);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: oklch(0.17 0.02 285); --surface: oklch(0.21 0.022 285); --surface-2: oklch(0.25 0.025 285);
  --ink: oklch(0.94 0.01 290); --ink-soft: oklch(0.74 0.02 290); --line: oklch(0.32 0.025 285);
  --brand: oklch(0.72 0.15 300); --brand-ink: oklch(0.8 0.12 300); --brand-soft: oklch(0.3 0.06 300); --on-brand: oklch(0.16 0.02 285);
  --ok: oklch(0.76 0.13 155); --ok-soft: oklch(0.29 0.05 155); --warn: oklch(0.8 0.12 80); --warn-soft: oklch(0.3 0.05 80);
  --risk: oklch(0.75 0.15 25); --risk-soft: oklch(0.3 0.06 25); --info: oklch(0.76 0.11 240); --info-soft: oklch(0.29 0.05 240);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem); font-weight: 700; }
h2 { font-size: 1.1rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 0.82rem; }
header.top { display: grid; gap: 18px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.counters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.counter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.counter b { font: 600 1.6rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.counter.attn { border-color: var(--brand); background: var(--brand-soft); }
.counter.attn b { color: var(--brand-ink); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 18px; }
nav.tabs button { font: 600 0.88rem var(--font-body); color: var(--ink-soft); background: transparent; border: 1px solid transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--brand-ink); background: var(--brand-soft); border-color: var(--brand); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
nav.tabs .badge { margin-left: 6px; font-size: 0.75rem; background: var(--brand); color: var(--on-brand); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
section.view { margin-top: 22px; display: grid; gap: 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 500 0.82rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-soft); }
.flux-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; color: var(--ink-soft); }
.flux-tag i { width: 8px; height: 8px; border-radius: 2px; background: var(--fc, var(--brand)); display: inline-block; }
.group { display: grid; gap: 12px; }
.group > h2 { display: flex; align-items: baseline; gap: 10px; }
.group > h2 small { font: 500 0.8rem var(--font-body); color: var(--ink-soft); }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; }
.q.answered { background: var(--surface-2); }
.q-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.prio { font-size: 0.72rem; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
.prio.high { color: var(--risk); background: var(--risk-soft); }
.prio.medium { color: var(--warn); background: var(--warn-soft); }
.prio.low { color: var(--info); background: var(--info-soft); }
.state { font-size: 0.74rem; font-weight: 600; border-radius: 999px; padding: 2px 9px; }
.state.open { color: var(--brand-ink); background: var(--brand-soft); }
.state.answered { color: var(--ok); background: var(--ok-soft); }
.q .context { color: var(--ink-soft); max-width: 72ch; white-space: pre-line; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.opt { position: relative; display: grid; gap: 3px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 10px 36px; cursor: pointer; background: var(--surface); min-width: 0; }
.opt input { position: absolute; left: 12px; top: 13px; accent-color: var(--brand); }
.opt:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.opt b { font-weight: 600; }
.opt .reco { font-size: 0.7rem; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: 0.06em; }
.opt span.d { color: var(--ink-soft); font-size: 0.85rem; }
textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 600 0.88rem var(--font-body); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: transparent; color: var(--brand-ink); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.answer { display: grid; gap: 4px; border-left: 3px solid var(--ok); padding-left: 12px; }
.note { font-size: 0.82rem; color: var(--ink-soft); }
.err { color: var(--risk); font-size: 0.85rem; }
.flux-progress { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.flux-progress > header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar { height: 6px; width: 160px; max-width: 40vw; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 16px; border-top: 1px solid var(--line); }
ul.items li:first-child { border-top: 0; }
.pill { font-size: 0.72rem; font-weight: 600; border-radius: 999px; padding: 2px 8px; justify-self: start; white-space: nowrap; }
.pill.done { color: var(--ok); background: var(--ok-soft); }
.pill.doing { color: var(--info); background: var(--info-soft); }
.pill.todo { color: var(--ink-soft); background: var(--surface-2); }
.pill.waiting { color: var(--brand-ink); background: var(--brand-soft); }
.pill.blocked { color: var(--risk); background: var(--risk-soft); }
.ref { color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.78rem; text-align: right; overflow-wrap: anywhere; }
ol.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
ol.timeline li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
ol.timeline li:first-child { border-top: 0; }
ol.timeline time { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
ol.timeline .id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--brand-ink); margin-right: 6px; }
.docs { display: grid; gap: 8px; }
.doc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.doc .path { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; color: var(--ink-soft); text-align: center; }
.banner { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; margin-top: 18px; }
@media (max-width: 720px) {
  .counters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  ul.items li { grid-template-columns: 1fr; gap: 4px; }
  .ref { text-align: left; }
  ol.timeline li { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: no-preference) { .q, .chip, .opt { transition: background-color .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Perso · aidrummer-for-reaper · novembre 2026</p>
      <h1>Pilotage AI Drummer</h1>
      <p class="muted" id="updated" style="margin-top:4px"></p>
    </div>
    <div class="counters" aria-live="polite">
      <div class="counter attn"><span class="eyebrow" data-i18n="cOpen"></span><b id="c-open">–</b></div>
      <div class="counter"><span class="eyebrow" data-i18n="cAnswered"></span><b id="c-answered">–</b></div>
      <div class="counter"><span class="eyebrow" data-i18n="cDecisions"></span><b id="c-decisions">–</b></div>
      <div class="counter"><span class="eyebrow" data-i18n="cDone"></span><b id="c-done">–</b></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-questions" aria-controls="questions" aria-selected="true"><span data-i18n="tQuestions"></span><span class="badge" id="tab-badge">–</span></button>
    <button role="tab" id="tab-progress" aria-controls="progress" aria-selected="false" data-i18n="tProgress"></button>
    <button role="tab" id="tab-decisions" aria-controls="decisions" aria-selected="false" data-i18n="tDecisions"></button>
    <button role="tab" id="tab-documents" aria-controls="documents" aria-selected="false" data-i18n="tDocuments"></button>
  </nav>

  <div id="offline" class="banner" hidden data-i18n="offline"></div>

  <section class="view" id="questions" role="tabpanel" aria-labelledby="tab-questions">
    <div class="toolbar" role="group">
      <button class="chip" data-filter="open" aria-pressed="true" data-i18n="fOpen"></button>
      <button class="chip" data-filter="answered" aria-pressed="false" data-i18n="fAnswered"></button>
      <button class="chip" data-filter="all" aria-pressed="false" data-i18n="fAll"></button>
    </div>
    <div id="q-list" class="group"></div>
  </section>
  <section class="view" id="progress" role="tabpanel" aria-labelledby="tab-progress" hidden><div id="p-list" class="group"></div></section>
  <section class="view" id="decisions" role="tabpanel" aria-labelledby="tab-decisions" hidden><div id="d-list"></div></section>
  <section class="view" id="documents" role="tabpanel" aria-labelledby="tab-documents" hidden>
    <p class="muted" data-i18n="docsIntro"></p>
    <div id="doc-list" class="docs"></div>
  </section>
</div>

<script>
/* UI strings. The language comes from meta/page.lang ("fr", "en"…). For another language, add a block with the same keys. */
const STRINGS = {
  fr: { cOpen: "Questions ouvertes", cAnswered: "Réponses données", cDecisions: "Décisions actées", cDone: "Tâches faites",
    tQuestions: "Questions", tProgress: "Avancement", tDecisions: "Décisions", tDocuments: "Documents",
    fOpen: "À répondre", fAnswered: "Répondues", fAll: "Toutes",
    offline: "La base de la page n'est pas joignable dans cette vue : connecte-toi à claude.ai pour lire et répondre aux questions.",
    docsIntro: "Fichiers et liens de référence (chemins à copier).", loading: "Chargement des données…",
    updated: "Mis à jour par Claude le {d}", unavailable: "Données indisponibles dans cette vue.",
    emptyQOpen: "Aucune question en attente. Claude ajoutera ici les prochaines.", emptyQ: "Rien à afficher pour ce filtre.",
    emptyP: "L'avancement apparaîtra ici.", emptyD: "Les décisions actées apparaîtront ici.", emptyDocs: "Les documents de référence apparaîtront ici.",
    question: "question", questions: "questions", priority: "Priorité", prio: { high: "haute", medium: "moyenne", low: "basse" },
    answered: "Répondu", toAnswer: "À répondre", recommended: "Recommandé", yourAnswer: "Ta réponse", commentOnly: "Commentaire seul",
    comment: "Commentaire ou précision (facultatif)", commentPh: "Ta précision, une autre option, une contrainte…",
    send: "Envoyer ma réponse", sending: "Envoi…", edit: "Modifier ma réponse", cancel: "Annuler",
    ack: "Pris en compte par Claude : {a}", willRead: "Claude la lira à sa prochaine étape.",
    needInput: "Choisis une option ou écris un commentaire.", noDb: "La base n'est pas joignable : connecte-toi à claude.ai puis recharge la page.",
    denied: "Tu n'as pas les droits d'écriture sur cette page.", failed: "Envoi impossible pour le moment. Réessaie dans un instant.",
    status: { done: "Fait", doing: "En cours", todo: "À faire", waiting: "Attend ta réponse", blocked: "Bloqué" },
    copy: "Copier", copied: "Copié", selected: "Sélectionné", pctDone: "{p} % fait" },
  en: { cOpen: "Open questions", cAnswered: "Answers given", cDecisions: "Decisions made", cDone: "Tasks done",
    tQuestions: "Questions", tProgress: "Progress", tDecisions: "Decisions", tDocuments: "Documents",
    fOpen: "To answer", fAnswered: "Answered", fAll: "All",
    offline: "The page's database is not reachable in this view: sign in to claude.ai to read and answer the questions.",
    docsIntro: "Reference files and links (paths to copy).", loading: "Loading…",
    updated: "Updated by Claude on {d}", unavailable: "Data unavailable in this view.",
    emptyQOpen: "No pending question. Claude will add the next ones here.", emptyQ: "Nothing to show for this filter.",
    emptyP: "Progress will appear here.", emptyD: "Decisions will appear here.", emptyDocs: "Reference documents will appear here.",
    question: "question", questions: "questions", priority: "Priority", prio: { high: "high", medium: "medium", low: "low" },
    answered: "Answered", toAnswer: "To answer", recommended: "Recommended", yourAnswer: "Your answer", commentOnly: "Comment only",
    comment: "Comment or detail (optional)", commentPh: "A detail, another option, a constraint…",
    send: "Send my answer", sending: "Sending…", edit: "Change my answer", cancel: "Cancel",
    ack: "Acknowledged by Claude: {a}", willRead: "Claude will read it at its next step.",
    needInput: "Pick an option or write a comment.", noDb: "The database is not reachable: sign in to claude.ai and reload the page.",
    denied: "You cannot write to this page.", failed: "Could not send right now. Try again in a moment.",
    status: { done: "Done", doing: "In progress", todo: "To do", waiting: "Waiting for you", blocked: "Blocked" },
    copy: "Copy", copied: "Copied", selected: "Selected", pctDone: "{p}% done" }
};
const PALETTE = ["oklch(0.6 0.17 300)", "oklch(0.62 0.13 240)", "oklch(0.65 0.13 155)", "oklch(0.7 0.13 80)", "oklch(0.62 0.16 340)", "oklch(0.6 0.12 200)", "oklch(0.6 0.15 30)", "oklch(0.6 0.04 285)"];
const PRIO_ALIASES = { haute: "high", moyenne: "medium", basse: "low" };
const state = { questions: [], items: [], decisions: [], docs: [], meta: null, filter: "open", db: null, uid: null, drafts: {} };

let S = STRINGS["fr"] || STRINGS.fr;
const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const locale = () => { const l = state.meta?.lang || "fr"; return l === "fr" ? "fr-FR" : l; };
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(locale(), { day: "2-digit", month: "short", year: "numeric" }); } catch { return iso; } };
const fmtDateTime = (iso) => { try { return new Date(iso).toLocaleString(locale(), { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); } catch { return iso; } };
const prioKey = (p) => PRIO_ALIASES[p] || p;

/* Workstreams come from meta/page.flux = [{code, label, color?}] in display order; undeclared codes are appended. */
function fluxList() {
  const declared = Array.isArray(state.meta?.flux) ? state.meta.flux : [];
  const codes = new Set(declared.map((f) => f.code));
  const extra = [...new Set([...state.questions, ...state.items, ...state.decisions].map((x) => x.flux).filter((c) => c && !codes.has(c)))];
  return [...declared, ...extra.map((c) => ({ code: c, label: c }))].map((f, i) => ({ ...f, color: f.color || PALETTE[i % PALETTE.length] }));
}
const fluxOf = (code) => fluxList().find((f) => f.code === code) || { code, label: code || "—", color: PALETTE[PALETTE.length - 1] };
const fluxTag = (code) => { const f = fluxOf(code); return `<span class="flux-tag" style="--fc:${esc(f.color)}"><i aria-hidden="true"></i>${esc(f.label)}</span>`; };
function applyStrings() {
  S = STRINGS[state.meta?.lang] || S;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = S[el.dataset.i18n] ?? ""; });
}

const TABS = ["questions", "progress", "decisions", "documents"];
function showTab(name) {
  if (!TABS.includes(name)) name = "questions";
  for (const t of TABS) { $("#tab-" + t).setAttribute("aria-selected", String(t === name)); $("#" + t).hidden = t !== name; }
  try { localStorage.setItem("pilotage-tab", name); } catch {}
}
for (const t of TABS) $("#tab-" + t).addEventListener("click", () => showTab(t));
let initial = (location.hash || "").slice(1);
if (!TABS.includes(initial)) { try { initial = localStorage.getItem("pilotage-tab") || "questions"; } catch { initial = "questions"; } }
showTab(initial);
document.querySelectorAll(".chip[data-filter]").forEach((b) => b.addEventListener("click", () => {
  state.filter = b.dataset.filter;
  document.querySelectorAll(".chip[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  renderQuestions();
}));

function renderCounters() {
  const open = state.questions.filter((q) => q.status !== "answered").length;
  $("#c-open").textContent = open; $("#tab-badge").textContent = open;
  $("#c-answered").textContent = state.questions.length - open;
  $("#c-decisions").textContent = state.decisions.length;
  $("#c-done").textContent = `${state.items.filter((i) => i.status === "done").length}/${state.items.length}`;
  const m = state.meta;
  $("#updated").textContent = m?.updated_at ? fmt(S.updated, { d: fmtDateTime(m.updated_at) }) + (m.note ? " · " + m.note : "") : (state.db ? "" : S.loading);
}

function renderQuestions() {
  const host = $("#q-list");
  let qs = state.questions.slice();
  if (state.filter === "open") qs = qs.filter((q) => q.status !== "answered");
  if (state.filter === "answered") qs = qs.filter((q) => q.status === "answered");
  if (!qs.length) { host.innerHTML = `<div class="empty">${esc(state.filter === "open" ? S.emptyQOpen : S.emptyQ)}</div>`; return; }
  const rank = { high: 0, medium: 1, low: 2 };
  qs.sort((a, b) => (rank[prioKey(a.priority)] ?? 3) - (rank[prioKey(b.priority)] ?? 3) || String(a.id).localeCompare(String(b.id)));
  const by = {}; for (const q of qs) (by[q.flux] ||= []).push(q);
  host.innerHTML = fluxList().filter((f) => by[f.code]).map((f) => `
    <div class="group"><h2>${esc(f.label)} <small>${by[f.code].length} ${esc(by[f.code].length > 1 ? S.questions : S.question)}</small></h2>
      ${by[f.code].map(qCard).join("")}</div>`).join("");
  host.querySelectorAll("form.qf").forEach(bindForm);
}

function qCard(q) {
  const answered = q.status === "answered" && q.answer;
  const editing = state.drafts[q.id]?.editing;
  const opts = Array.isArray(q.options) ? q.options : [];
  const chosen = state.drafts[q.id]?.choice ?? q.answer?.choice ?? "";
  const p = prioKey(q.priority);
  const answerBlock = answered && !editing ? `
    <div class="answer"><span class="eyebrow">${esc(S.yourAnswer)} · ${esc(fmtDateTime(q.answer.answered_at))}</span>
      <b>${esc(opts.find((o) => o.value === q.answer.choice)?.label || q.answer.choice || S.commentOnly)}</b>
      ${q.answer.comment ? `<p>${esc(q.answer.comment)}</p>` : ""}</div>
    <div class="actions"><button type="button" class="btn ghost" data-edit="${esc(q.id)}">${esc(S.edit)}</button>
      <span class="note">${esc(q.claude_ack ? fmt(S.ack, { a: q.claude_ack }) : S.willRead)}</span></div>` : "";
  const form = !answered || editing ? `
    <form class="qf" data-id="${esc(q.id)}">
      ${opts.length ? `<div class="opts" role="radiogroup">${opts.map((o, i) => `
        <label class="opt"><input type="radio" name="c-${esc(q.id)}" id="c-${esc(q.id)}-${i}" value="${esc(o.value)}" ${chosen === o.value ? "checked" : ""}>
          ${o.recommended ? `<span class="reco">${esc(S.recommended)}</span>` : ""}<b>${esc(o.label)}</b>${o.desc ? `<span class="d">${esc(o.desc)}</span>` : ""}</label>`).join("")}</div>` : ""}
      <label class="eyebrow" for="t-${esc(q.id)}" style="display:block;margin-top:10px">${esc(S.comment)}</label>
      <textarea id="t-${esc(q.id)}" name="comment" placeholder="${esc(S.commentPh)}">${esc(state.drafts[q.id]?.comment ?? q.answer?.comment ?? "")}</textarea>
      <div class="actions" style="margin-top:10px"><button class="btn" type="submit">${esc(S.send)}</button>
        ${editing ? `<button type="button" class="btn ghost" data-cancel="${esc(q.id)}">${esc(S.cancel)}</button>` : ""}
        <span class="err" role="alert" hidden></span></div>
    </form>` : "";
  return `<article class="q ${answered && !editing ? "answered" : ""}" id="q-${esc(q.id)}">
      <div class="q-head"><div class="q-meta">${fluxTag(q.flux)}<span class="mono muted">${esc(q.id)}</span>${q.priority ? `<span class="prio ${esc(p)}">${esc(S.priority)} ${esc(S.prio[p] || q.priority)}</span>` : ""}</div>
        <span class="state ${answered ? "answered" : "open"}">${esc(answered ? S.answered : S.toAnswer)}</span></div>
      <h3>${esc(q.title)}</h3>${q.context ? `<p class="context">${esc(q.context)}</p>` : ""}${answerBlock}${form}</article>`;
}

function bindForm(form) {
  const id = form.dataset.id;
  form.addEventListener("change", () => { const fd = new FormData(form); state.drafts[id] = { ...(state.drafts[id] || {}), choice: fd.get("c-" + id) || "", comment: fd.get("comment") || "" }; });
  form.addEventListener("input", () => { state.drafts[id] = { ...(state.drafts[id] || {}), comment: form.querySelector("textarea").value }; });
  form.querySelector("[data-cancel]")?.addEventListener("click", () => { delete state.drafts[id]; renderQuestions(); });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = form.querySelector(".err"); err.hidden = true;
    const fd = new FormData(form); const choice = fd.get("c-" + id) || ""; const comment = String(fd.get("comment") || "").trim();
    if (!choice && !comment) { err.textContent = S.needInput; err.hidden = false; return; }
    if (!state.db) { err.textContent = S.noDb; err.hidden = false; return; }
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = S.sending;
    try {
      await state.db.doc("questions/" + id).update({ status: "answered", answer: { choice, comment, answered_at: new Date().toISOString(), by: state.uid || null } });
      delete state.drafts[id];
    } catch (ex) {
      err.textContent = ex?.code === "permission_denied" ? S.denied : S.failed; err.hidden = false; btn.disabled = false; btn.textContent = S.send;
    }
  });
}
document.addEventListener("click", (e) => {
  const ed = e.target.closest?.("[data-edit]");
  if (ed) { const id = ed.dataset.edit; const q = state.questions.find((x) => x.id === id);
    state.drafts[id] = { editing: true, choice: q?.answer?.choice || "", comment: q?.answer?.comment || "" }; renderQuestions(); }
});

function renderProgress() {
  const host = $("#p-list");
  if (!state.items.length) { host.innerHTML = `<div class="empty">${esc(S.emptyP)}</div>`; return; }
  const rank = { waiting: 0, blocked: 1, doing: 2, todo: 3, done: 4 };
  const by = {}; for (const it of state.items) (by[it.flux] ||= []).push(it);
  host.innerHTML = fluxList().filter((f) => by[f.code]).map((f) => {
    const list = by[f.code].slice().sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9) || (a.order ?? 0) - (b.order ?? 0));
    const done = list.filter((i) => i.status === "done").length; const pct = Math.round((done / list.length) * 100);
    return `<div class="flux-progress"><header><div>${fluxTag(f.code)}</div><div style="display:flex;align-items:center;gap:10px"><span class="muted" style="font-variant-numeric:tabular-nums">${done}/${list.length}</span><span class="bar" role="img" aria-label="${esc(fmt(S.pctDone, { p: pct }))}"><i style="width:${pct}%"></i></span></div></header>
      <ul class="items">${list.map((it) => `<li><span class="pill ${esc(it.status)}">${esc(S.status[it.status] || it.status)}</span><span>${esc(it.title)}${it.detail ? `<br><span class="note">${esc(it.detail)}</span>` : ""}</span><span class="ref">${esc(it.ref || "")}</span></li>`).join("")}</ul></div>`;
  }).join("");
}

function renderDecisions() {
  const host = $("#d-list");
  if (!state.decisions.length) { host.innerHTML = `<div class="empty">${esc(S.emptyD)}</div>`; return; }
  const list = state.decisions.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)));
  host.innerHTML = `<ol class="timeline">${list.map((d) => `<li><time datetime="${esc(d.date)}">${esc(fmtDate(d.date))}</time><div>${fluxTag(d.flux)}<p style="margin-top:3px"><span class="id">${esc(d.id)}</span>${esc(d.text)}</p></div></li>`).join("")}</ol>`;
}

function renderDocs() {
  const host = $("#doc-list");
  if (!state.docs.length) { host.innerHTML = `<div class="empty">${esc(S.emptyDocs)}</div>`; return; }
  const list = state.docs.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  host.innerHTML = list.map((d, i) => `<div class="doc"><div style="min-width:0"><b>${esc(d.title)}</b>${d.desc ? ` <span class="muted">· ${esc(d.desc)}</span>` : ""}<div class="path" id="path-${i}">${esc(d.path)}</div></div><button type="button" class="btn ghost" data-copy="path-${i}">${esc(S.copy)}</button></div>`).join("");
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest?.("[data-copy]"); if (!b) return;
  const el = document.getElementById(b.dataset.copy); const text = el?.textContent || "";
  try { await navigator.clipboard.writeText(text); b.textContent = S.copied; setTimeout(() => (b.textContent = S.copy), 1500); }
  catch { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = S.selected; }
});

function renderAll() { applyStrings(); renderCounters(); renderQuestions(); renderProgress(); renderDecisions(); renderDocs(); }
renderAll();

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) { $("#offline").hidden = false; $("#updated").textContent = S.unavailable; return; }
  state.db = db;
  try { const user = await window.claude.use("user"); state.uid = user ? await user.id() : null; } catch {}
  const sub = (name) => db.collection(name).onSnapshot((snap) => { state[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); renderAll(); }, () => { $("#offline").hidden = false; });
  sub("questions"); sub("items"); sub("decisions"); sub("docs");
  db.doc("meta/page").onSnapshot((d) => { state.meta = d.exists ? d.data() : null; renderAll(); });
})();
</script>
